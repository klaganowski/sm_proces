<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BPMN Viewer</title>

  <link rel="stylesheet" href="https://unpkg.com/bpmn-js/dist/assets/diagram-js.css">
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js/dist/assets/bpmn-font/css/bpmn.css">

  <style>
html, body, #canvas {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
}

/* canvas */
.djs-container,
.djs-container svg {
  background: transparent !important;
}

/* główne tło diagramu / lanes */
.djs-shape .djs-visual rect,
.djs-shape .djs-visual polygon,
.djs-shape .djs-visual circle,
.djs-shape .djs-visual ellipse {
  fill: #2a2d42 !important;
  stroke: #8f96b8 !important;
  stroke-width: 1.6px !important;
}

/* lane / pool większe obszary */
.djs-shape[data-element-id*="Participant"] .djs-visual rect,
.djs-shape[data-element-id*="Lane"] .djs-visual rect {
  fill: #25283a !important;
  stroke: #70789b !important;
}

/* taski */
.djs-shape[data-element-id*="Activity"] .djs-visual rect,
.djs-shape[data-element-id*="Task"] .djs-visual rect {
  fill: #262a3f !important;
  stroke: #7f8bb3 !important;
  stroke-width: 2px !important;
  rx: 10px;
}

/* notatki / adnotacje */
.djs-shape[data-element-id*="TextAnnotation"] .djs-visual rect,
.djs-shape[data-element-id*="TextAnnotation"] .djs-visual path {
  fill: rgba(31, 34, 50, 0.96) !important;
  stroke: #6f7aa4 !important;
}

/* 🔥 najważniejsze: wymuszenie jasnego tekstu */
.djs-label,
.djs-label *,
.djs-shape text,
.djs-shape text *,
.djs-connection text,
.djs-connection text *,
.djs-direct-editing-content,
text,
tspan {
  fill: #ffffff !important;
  color: #ffffff !important;
  stroke: none !important;
  font-weight: 600 !important;
  text-shadow: none !important;
}

/* teksty mniej ważne też czytelne */
.djs-label {
  opacity: 1 !important;
}

/* flow / linie */
.djs-connection path {
  stroke: #aeb6d8 !important;
  stroke-width: 1.7px !important;
}

/* dashed flow */
.djs-connection path[stroke-dasharray],
.djs-connection path[style*="dash"] {
  stroke: #aeb6d8 !important;
}

/* markery / strzałki */
.marker,
marker path,
marker polygon {
  fill: #aeb6d8 !important;
  stroke: #aeb6d8 !important;
}

/* event circles */
.djs-shape .djs-visual circle {
  fill: #2a2d42 !important;
  stroke: #9aa4cf !important;
}

/* hover jak Monday blue */
.djs-element.hover .djs-outline,
.djs-element.selected .djs-outline {
  stroke: #0073ea !important;
  stroke-width: 2.5px !important;
}

/* lekki glow na hover */
.djs-element.hover .djs-visual > :first-child {
  filter: drop-shadow(0 0 6px rgba(0, 115, 234, 0.45));
}

/* ukrycie bpmn.io */
.bjs-powered-by {
  display: none !important;
}

/* watermark */
.watermark {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 10;
  opacity: 0.35;
  pointer-events: none;
}

.watermark img {
  height: 14px;
  max-width: 80px;
  object-fit: contain;
  filter: brightness(1.1);
}

/* controls pod Monday */
.controls {
  position: fixed;
  right: 12px;
  bottom: 42px;
  z-index: 10;
  display: flex;
  gap: 6px;
  background: rgba(41, 45, 69, 0.88);
  backdrop-filter: blur(10px);
  padding: 6px;
  border-radius: 10px;
  border: 1px solid #565d80;
  box-shadow: 0 8px 24px rgba(0,0,0,.28);
}

.controls button {
  border: 1px solid #666f99;
  background: #323750;
  color: #ffffff;
  padding: 6px 10px;
  cursor: pointer;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 600;
}

.controls button:hover {
  background: #0073ea;
  border-color: #0073ea;
}
  </style>
</head>

<body>
  <div id="canvas"></div>

  <!-- watermark -->
  <div class="watermark">
    <img src="https://i.imgur.com/I65QNca.png" />
  </div>

  <div class="controls">
    <button onclick="zoomOut()">−</button>
    <button onclick="resetZoom()">100%</button>
    <button onclick="zoomIn()">+</button>
    <button onclick="fitView()">Fit</button>
  </div>

  <script src="https://unpkg.com/bpmn-js/dist/bpmn-navigated-viewer.development.js"></script>

  <script>
    const viewer = new BpmnJS({
      container: '#canvas',
      zoomScroll: {
        enabled: true,
        modifiers: []
      }
    });

    let canvas;
    let currentZoom = 0.75;

    fetch('./diagram.bpmn')
      .then(response => {
        if (!response.ok) {
          throw new Error('Nie znaleziono diagram.bpmn: ' + response.status);
        }
        return response.text();
      })
      .then(async xml => {
        await viewer.importXML(xml);

        canvas = viewer.get('canvas');

        canvas.zoom(currentZoom);
        canvas.scroll({ dx: -80, dy: -60 });
      })
      .catch(error => {
        console.error('BPMN load error:', error);
        document.body.innerHTML = 'Nie udało się załadować diagramu BPMN.';
      });

    function zoomIn() {
      currentZoom = Math.min(currentZoom + 0.15, 3);
      canvas.zoom(currentZoom);
    }

    function zoomOut() {
      currentZoom = Math.max(currentZoom - 0.15, 0.2);
      canvas.zoom(currentZoom);
    }

    function resetZoom() {
      currentZoom = 1;
      canvas.zoom(currentZoom);
    }

    function fitView() {
      canvas.zoom('fit-viewport');
    }
  </script>
</body>
</html>
