<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BPMN Viewer</title>

  <link rel="stylesheet" href="https://unpkg.com/bpmn-js/dist/assets/diagram-js.css">
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js/dist/assets/bpmn-font/css/bpmn.css">

  <style>
 html, body, #canvas {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
}

/* transparent canvas */
.djs-container,
.djs-container svg {
  background: transparent !important;
}

/* 🌙 GLOBAL BPMN COLORS */
.djs-visual > :nth-child(1) {
  fill: #1e1f26 !important; /* tło elementów */
  stroke: #6c6f7d !important;
}

.djs-visual > :nth-child(2) {
  stroke: #6c6f7d !important;
}

/* tekst */
.djs-label {
  fill: #e5e7eb !important;
  font-weight: 500;
}

/* linie / flow */
.djs-connection path {
  stroke: #9aa0aa !important;
}

/* strzałki */
.marker {
  fill: #9aa0aa !important;
  stroke: #9aa0aa !important;
}

/* hover / selection */
.djs-element.hover .djs-outline {
  stroke: #4f8cff !important;
}

.djs-element.selected .djs-outline {
  stroke: #4f8cff !important;
  stroke-width: 2px;
}

/* 🌊 lanes (tło swimlanes) */
.djs-element .djs-visual rect {
  rx: 6px;
}

/* watermark */
.watermark {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 10;
  opacity: 0.4;
  pointer-events: none;
}

/* controls */
.controls {
  position: fixed;
  right: 12px;
  bottom: 50px;
  z-index: 10;
  display: flex;
  gap: 6px;
  background: rgba(30, 31, 38, 0.8);
  backdrop-filter: blur(6px);
  padding: 6px;
  border-radius: 8px;
  border: 1px solid #2f3342;
}

.controls button {
  border: 1px solid #3a3f55;
  background: #2a2d3a;
  color: #e5e7eb;
  padding: 6px 10px;
  cursor: pointer;
  border-radius: 5px;
  font-size: 14px;
}

.controls button:hover {
  background: #3a3f55;
}
  </style>
</head>

<body>
  <div id="canvas"></div>

  <!-- watermark -->
  <div class="watermark">
    <img src="https://i.imgur.com/I65QNca.png" />
  </div>

  <div class="controls">
    <button onclick="zoomOut()">−</button>
    <button onclick="resetZoom()">100%</button>
    <button onclick="zoomIn()">+</button>
    <button onclick="fitView()">Fit</button>
  </div>

  <script src="https://unpkg.com/bpmn-js/dist/bpmn-navigated-viewer.development.js"></script>

  <script>
    const viewer = new BpmnJS({
      container: '#canvas',
      zoomScroll: {
        enabled: true,
        modifiers: []
      }
    });

    let canvas;
    let currentZoom = 0.75;

    fetch('./diagram.bpmn')
      .then(response => {
        if (!response.ok) {
          throw new Error('Nie znaleziono diagram.bpmn: ' + response.status);
        }
        return response.text();
      })
      .then(async xml => {
        await viewer.importXML(xml);

        canvas = viewer.get('canvas');

        canvas.zoom(currentZoom);
        canvas.scroll({ dx: -80, dy: -60 });
      })
      .catch(error => {
        console.error('BPMN load error:', error);
        document.body.innerHTML = 'Nie udało się załadować diagramu BPMN.';
      });

    function zoomIn() {
      currentZoom = Math.min(currentZoom + 0.15, 3);
      canvas.zoom(currentZoom);
    }

    function zoomOut() {
      currentZoom = Math.max(currentZoom - 0.15, 0.2);
      canvas.zoom(currentZoom);
    }

    function resetZoom() {
      currentZoom = 1;
      canvas.zoom(currentZoom);
    }

    function fitView() {
      canvas.zoom('fit-viewport');
    }
  </script>
</body>
</html>
