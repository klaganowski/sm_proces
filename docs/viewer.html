<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BPMN Viewer</title>

  <link rel="stylesheet" href="https://unpkg.com/bpmn-js/dist/assets/diagram-js.css">
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js/dist/assets/bpmn-font/css/bpmn.css">

  <style>
    html, body, #canvas {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="canvas"></div>

  <!-- navigated viewer -->
  <script src="https://unpkg.com/bpmn-js/dist/bpmn-navigated-viewer.development.js"></script>

  <script>
    const viewer = new BpmnJS({
      container: '#canvas',
      zoomScroll: {
        enabled: true,
        modifiers: [] // ← zoom bez Ctrl
      }
    });

    fetch('./diagram.bpmn')
      .then(response => {
        if (!response.ok) {
          throw new Error('Nie znaleziono diagram.bpmn: ' + response.status);
        }
        return response.text();
      })
      .then(async xml => {
        await viewer.importXML(xml);
        viewer.get('canvas').zoom('fit-viewport');
      })
      .catch(error => {
        console.error('BPMN load error:', error);
        document.body.innerHTML = 'Nie udało się załadować diagramu BPMN.';
      });
  </script>
</body>
</html>
