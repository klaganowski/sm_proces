<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BPMN Viewer</title>

  <link rel="stylesheet" href="https://unpkg.com/bpmn-js/dist/assets/diagram-js.css">
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js/dist/assets/bpmn-font/css/bpmn.css">

  <style>
    html, body, #canvas {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    .djs-container,
    .djs-container svg {
      background: transparent !important;
    }

    .djs-shape .djs-visual rect,
    .djs-shape .djs-visual polygon,
    .djs-shape .djs-visual circle {
      fill: #2a2d42 !important;
      stroke: #8f96b8 !important;
      stroke-width: 1.6px !important;
    }

    .djs-shape[data-element-id*="Activity"] .djs-visual rect {
      fill: #262a3f !important;
      stroke: #7f8bb3 !important;
      stroke-width: 2px !important;
      rx: 10px;
    }

    text, tspan {
      fill: #ffffff !important;
      stroke: none !important;
      font-weight: 600 !important;
    }

    .djs-label {
      fill: #ffffff !important;
    }

    .djs-connection path {
      stroke: #aeb6d8 !important;
      stroke-width: 1.7px !important;
    }

    marker path {
      fill: #aeb6d8 !important;
    }

    .djs-element.hover .djs-outline,
    .djs-element.selected .djs-outline {
      stroke: #0073ea !important;
      stroke-width: 2.5px !important;
    }

    .djs-element.hover .djs-visual > :first-child {
      filter: drop-shadow(0 0 6px rgba(0,115,234,.4));
    }

    .bjs-powered-by {
      display: none !important;
    }

    .watermark {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      opacity: 0.35;
      pointer-events: none;
    }

    .watermark img {
      height: 14px;
    }

    .controls {
      position: fixed;
      right: 12px;
      bottom: 42px;
      z-index: 10;
      display: flex;
      gap: 6px;
      background: rgba(41,45,69,0.9);
      backdrop-filter: blur(10px);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid #565d80;
    }

    .controls button {
      border: 1px solid #666f99;
      background: #323750;
      color: #fff;
      padding: 6px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
    }

    .controls button:hover {
      background: #0073ea;
      border-color: #0073ea;
    }

    /* wąski pasek z lewej */
    .sticky-lanes {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 24px;
      z-index: 999;
      pointer-events: none;
      background: #25283a;
      border-right: 1px solid #565d80;
    }

    .sticky-lane-label {
      position: absolute;
      width: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      border-bottom: 1px solid rgba(143,150,184,0.4);
      box-sizing: border-box;
      overflow: hidden;
    }
  </style>
</head>

<body>

<div id="canvas"></div>
<div id="stickyLanes" class="sticky-lanes"></div>

<div class="watermark">
  <img src="https://i.imgur.com/I65QNca.png" />
</div>

<div class="controls">
  <button onclick="zoomOut()">−</button>
  <button onclick="resetZoom()">100%</button>
  <button onclick="zoomIn()">+</button>
  <button onclick="fitView()">Fit</button>
</div>

<script src="https://unpkg.com/bpmn-js/dist/bpmn-navigated-viewer.development.js"></script>

<script>
  const viewer = new BpmnJS({
    container: '#canvas',
    zoomScroll: {
      enabled: true,
      modifiers: []
    }
  });

  let canvas;
  let currentZoom = 0.75;

  fetch('./diagram.bpmn')
    .then(response => {
      if (!response.ok) {
        throw new Error('Nie znaleziono diagram.bpmn: ' + response.status);
      }
      return response.text();
    })
    .then(async xml => {
      await viewer.importXML(xml);

      canvas = viewer.get('canvas');

      canvas.zoom(currentZoom);
      canvas.scroll({ dx: -180, dy: -60 });

      setupStickyLanes();
      fixTextScale();
    })
    .catch(error => {
      console.error('BPMN load error:', error);
      document.body.innerHTML = 'Nie udało się załadować diagramu BPMN.';
    });

  function zoomIn() {
    currentZoom = Math.min(currentZoom + 0.15, 3);
    canvas.zoom(currentZoom);
    fixTextScale();
  }

  function zoomOut() {
    currentZoom = Math.max(currentZoom - 0.15, 0.2);
    canvas.zoom(currentZoom);
    fixTextScale();
  }

  function resetZoom() {
    currentZoom = 1;
    canvas.zoom(currentZoom);
    fixTextScale();
  }

  function fitView() {
    canvas.zoom('fit-viewport');
    fixTextScale();
  }

  function setupStickyLanes() {
    const elementRegistry = viewer.get('elementRegistry');
    const eventBus = viewer.get('eventBus');
    const sticky = document.getElementById('stickyLanes');

    function render() {
      sticky.innerHTML = '';

      const viewbox = canvas.viewbox();

      const lanes = elementRegistry.filter(el => {
        const bo = el.businessObject;
        return bo && (bo.$type === 'bpmn:Lane' || bo.$type === 'bpmn:Participant');
      });

      lanes.forEach(lane => {
        const name = lane.businessObject.name;
        if (!name) return;

        const top = (lane.y - viewbox.y) * viewbox.scale;
        const height = lane.height * viewbox.scale;

        if (top + height < 0 || top > window.innerHeight) return;

        const div = document.createElement('div');
        div.className = 'sticky-lane-label';
        div.innerText = name;

        div.style.top = top + 'px';
        div.style.height = height + 'px';

        sticky.appendChild(div);
      });
    }

    render();

    eventBus.on('canvas.viewbox.changed', () => {
      render();
      fixTextScale();
    });

    window.addEventListener('resize', () => {
      render();
      fixTextScale();
    });
  }

  function fixTextScale() {
    if (!canvas) return;

    const scale = canvas.viewbox().scale;

    document.querySelectorAll('.djs-label, text').forEach(el => {
      el.style.transformBox = 'fill-box';
      el.style.transformOrigin = 'center';
      el.style.transform = `scale(${Math.max(1, 1 / scale)})`;
    });
  }
</script>

</body>
</html>
