<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BPMN Viewer</title>

  <link rel="stylesheet" href="https://unpkg.com/bpmn-js/dist/assets/diagram-js.css">
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js/dist/assets/bpmn-font/css/bpmn.css">

  <style>
/* base */
html, body, #canvas {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
}

/* usuń tło svg */
.djs-container,
.djs-container svg {
  background: transparent !important;
}

/* 🔥 SHAPES (tasky, boxy) */
.djs-visual > :nth-child(1) {
  fill: #1b1d26 !important;
  stroke: #4b5166 !important;
  stroke-width: 1.5px;
}

/* 🔥 TEXT (KLUCZOWE – tutaj był problem) */
.djs-label {
  fill: #ffffff !important;
  font-weight: 600;
  font-size: 13px;
  text-shadow: none !important;
}

/* usuwamy „rozmycie” tekstu */
text {
  fill: #ffffff !important;
  stroke: none !important;
}

/* 🌊 LINES */
.djs-connection path {
  stroke: #8b93a7 !important;
  stroke-width: 1.5px;
}

/* strzałki */
.marker {
  fill: #8b93a7 !important;
  stroke: #8b93a7 !important;
}

/* ✨ HOVER */
.djs-element.hover .djs-outline {
  stroke: #5b8cff !important;
  stroke-width: 2px;
}

/* SELECT */
.djs-element.selected .djs-outline {
  stroke: #5b8cff !important;
  stroke-width: 2px;
}

/* lanes (duże boxy) */
.djs-element .djs-visual rect {
  rx: 8px;
}

/* ❌ ukryj bpmn.io */
.bjs-powered-by {
  display: none !important;
}

/* 🟣 WATERMARK (POPRAWKA) */
.watermark {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 10;
  opacity: 0.35;
  pointer-events: none;
}

.watermark img {
  height: 16px;   /* ← było za duże */
  filter: brightness(0.9);
}

/* 🎛️ CONTROLS */
.controls {
  position: fixed;
  right: 12px;
  bottom: 44px;
  z-index: 10;
  display: flex;
  gap: 6px;
  background: rgba(25, 27, 36, 0.8);
  backdrop-filter: blur(8px);
  padding: 6px;
  border-radius: 8px;
  border: 1px solid #2e3347;
}

.controls button {
  border: 1px solid #3a4060;
  background: #242736;
  color: #ffffff;
  padding: 6px 10px;
  cursor: pointer;
  border-radius: 5px;
  font-size: 13px;
}

.controls button:hover {
  background: #2f3450;
}
  </style>
</head>

<body>
  <div id="canvas"></div>

  <!-- watermark -->
  <div class="watermark">
    <img src="https://i.imgur.com/I65QNca.png" />
  </div>

  <div class="controls">
    <button onclick="zoomOut()">−</button>
    <button onclick="resetZoom()">100%</button>
    <button onclick="zoomIn()">+</button>
    <button onclick="fitView()">Fit</button>
  </div>

  <script src="https://unpkg.com/bpmn-js/dist/bpmn-navigated-viewer.development.js"></script>

  <script>
    const viewer = new BpmnJS({
      container: '#canvas',
      zoomScroll: {
        enabled: true,
        modifiers: []
      }
    });

    let canvas;
    let currentZoom = 0.75;

    fetch('./diagram.bpmn')
      .then(response => {
        if (!response.ok) {
          throw new Error('Nie znaleziono diagram.bpmn: ' + response.status);
        }
        return response.text();
      })
      .then(async xml => {
        await viewer.importXML(xml);

        canvas = viewer.get('canvas');

        canvas.zoom(currentZoom);
        canvas.scroll({ dx: -80, dy: -60 });
      })
      .catch(error => {
        console.error('BPMN load error:', error);
        document.body.innerHTML = 'Nie udało się załadować diagramu BPMN.';
      });

    function zoomIn() {
      currentZoom = Math.min(currentZoom + 0.15, 3);
      canvas.zoom(currentZoom);
    }

    function zoomOut() {
      currentZoom = Math.max(currentZoom - 0.15, 0.2);
      canvas.zoom(currentZoom);
    }

    function resetZoom() {
      currentZoom = 1;
      canvas.zoom(currentZoom);
    }

    function fitView() {
      canvas.zoom('fit-viewport');
    }
  </script>
</body>
</html>
