<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BPMN Viewer</title>

  <link rel="stylesheet" href="https://unpkg.com/bpmn-js/dist/assets/diagram-js.css">
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js/dist/assets/bpmn-font/css/bpmn.css">

  <style>
    html, body, #canvas {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    .djs-container,
    .djs-container svg {
      background: transparent !important;
    }

    .djs-shape .djs-visual rect,
    .djs-shape .djs-visual polygon,
    .djs-shape .djs-visual circle,
    .djs-shape .djs-visual ellipse {
      fill: #2a2d42 !important;
      stroke: #8f96b8 !important;
      stroke-width: 1.6px !important;
    }

    .lane-color-0 .djs-visual rect { fill: #202b4f !important; }
    .lane-color-1 .djs-visual rect { fill: #253b38 !important; }
    .lane-color-2 .djs-visual rect { fill: #3b2d4f !important; }
    .lane-color-3 .djs-visual rect { fill: #4a302d !important; }
    .lane-color-4 .djs-visual rect { fill: #3f3a24 !important; }
    .lane-color-5 .djs-visual rect { fill: #24384d !important; }
    .lane-color-6 .djs-visual rect { fill: #3b2842 !important; }

    .djs-shape[data-element-id*="Activity"] .djs-visual rect,
    .djs-shape[data-element-id*="Task"] .djs-visual rect {
      fill: #262a3f !important;
      stroke: #7f8bb3 !important;
      stroke-width: 2px !important;
      rx: 10px;
    }

    text,
    tspan,
    .djs-label,
    .djs-label * {
      fill: #ffffff !important;
      color: #ffffff !important;
      stroke: none !important;
      font-weight: 600 !important;
      text-shadow: none !important;
    }

    .djs-connection path {
      stroke: #aeb6d8 !important;
      stroke-width: 1.7px !important;
    }

    marker path,
    marker polygon {
      fill: #aeb6d8 !important;
      stroke: #aeb6d8 !important;
    }

    .djs-element.hover .djs-outline,
    .djs-element.selected .djs-outline {
      stroke: #0073ea !important;
      stroke-width: 2.5px !important;
    }

    .djs-element.hover .djs-visual > :first-child {
      filter: drop-shadow(0 0 6px rgba(0,115,234,.4));
    }

    .clickable-task .djs-visual > :first-child {
      stroke: #00c875 !important;
    }

    .bjs-powered-by {
      display: none !important;
    }

    .controls {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      display: flex;
      gap: 6px;
      background: rgba(41,45,69,0.9);
      backdrop-filter: blur(10px);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid #565d80;
    }

    .controls button {
      border: 1px solid #666f99;
      background: #323750;
      color: #fff;
      padding: 6px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
    }

    .controls button:hover {
      background: #0073ea;
      border-color: #0073ea;
    }

    .sticky-lanes {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 24px;
      z-index: 999;
      pointer-events: none;
      background: transparent;
      display: none;
    }

    .sticky-lane-label {
      position: absolute;
      left: 0;
      width: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      box-sizing: border-box;
      overflow: hidden;
      background: rgba(37,40,58,0.96);
      border-right: 1px solid #565d80;
      border-top: 1px solid rgba(143,150,184,0.45);
      border-bottom: 1px solid rgba(143,150,184,0.45);
    }

    .task-tooltip {
      position: fixed;
      display: none;
      max-width: 360px;
      z-index: 2000;
      pointer-events: none;
      background: rgba(31,35,52,.97);
      color: #fff;
      border: 1px solid #606a95;
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,.36);
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }

    .task-tooltip strong {
      display: block;
      margin: 0 0 8px 0;
      color: #fff;
      font-size: 14px;
      line-height: 1.35;
    }

    .task-tooltip .description {
      white-space: pre-line;
      margin: 0;
    }

    .task-tooltip .click-hint {
      margin-top: 8px;
      color: #00c875;
      font-size: 11px;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div id="canvas"></div>
<div id="stickyLanes" class="sticky-lanes"></div>
<div id="taskTooltip" class="task-tooltip"></div>

<div class="controls">
  <button onclick="zoomOut()">−</button>
  <button onclick="resetZoom()">100%</button>
  <button onclick="zoomIn()">+</button>
  <button onclick="fitView()">Fit</button>
</div>

<script src="https://unpkg.com/bpmn-js/dist/bpmn-navigated-viewer.development.js"></script>

<script>
  const viewer = new BpmnJS({
    container: '#canvas',
    zoomScroll: {
      enabled: true,
      modifiers: []
    }
  });

  let canvas;
  let currentZoom = 0.75;

  fetch('./diagram.bpmn')
    .then(response => {
      if (!response.ok) {
        throw new Error('Nie znaleziono diagram.bpmn');
      }
      return response.text();
    })
    .then(async xml => {
      await viewer.importXML(xml);

      canvas = viewer.get('canvas');

      canvas.zoom(currentZoom);
      canvas.scroll({ dx: -180, dy: -60 });

      colorizeLanes();
      setupStickyLanes();
      setupTaskTooltipsAndLinks();
    })
    .catch(error => {
      console.error(error);
    });

  function zoomIn() {
    currentZoom = Math.min(currentZoom + 0.15, 3);
    canvas.zoom(currentZoom);
  }

  function zoomOut() {
    currentZoom = Math.max(currentZoom - 0.15, 0.2);
    canvas.zoom(currentZoom);
  }

  function resetZoom() {
    currentZoom = 1;
    canvas.zoom(currentZoom);
  }

  function fitView() {
    canvas.zoom('fit-viewport');
  }

  function colorizeLanes() {
    const elementRegistry = viewer.get('elementRegistry');

    const lanes = elementRegistry.filter(el => {
      const bo = el.businessObject;
      return bo && bo.$type === 'bpmn:Lane';
    });

    lanes.forEach((lane, index) => {
      const gfx = elementRegistry.getGraphics(lane);
      if (!gfx) return;

      gfx.classList.add('lane-color-' + (index % 7));
    });
  }

  function setupStickyLanes() {
    const elementRegistry = viewer.get('elementRegistry');
    const eventBus = viewer.get('eventBus');
    const sticky = document.getElementById('stickyLanes');

    function render() {
      sticky.innerHTML = '';

      const viewbox = canvas.viewbox();
      let visibleLabelsCount = 0;

      const lanes = elementRegistry.filter(el => {
        const bo = el.businessObject;
        return bo && bo.$type === 'bpmn:Lane';
      });

      lanes.forEach(lane => {
        const name = lane.businessObject.name;
        if (!name) return;

        const originalLeftOnScreen = (lane.x - viewbox.x) * viewbox.scale;

        if (originalLeftOnScreen >= 0) return;

        const top = (lane.y - viewbox.y) * viewbox.scale;
        const height = lane.height * viewbox.scale;

        if (top + height < 0 || top > window.innerHeight) return;

        const visibleTop = Math.max(0, top);
        const visibleBottom = Math.min(window.innerHeight, top + height);
        const visibleHeight = visibleBottom - visibleTop;

        if (visibleHeight < 24) return;

        const div = document.createElement('div');
        div.className = 'sticky-lane-label';
        div.innerText = name;

        div.style.top = visibleTop + 'px';
        div.style.height = visibleHeight + 'px';

        const fontSize = Math.max(9, Math.min(16, 10 * viewbox.scale));
        div.style.fontSize = fontSize + 'px';

        sticky.appendChild(div);
        visibleLabelsCount++;
      });

      sticky.style.display = visibleLabelsCount > 0 ? 'block' : 'none';
    }

    render();

    eventBus.on('canvas.viewbox.changed', render);
    window.addEventListener('resize', render);
  }

  function setupTaskTooltipsAndLinks() {
    const eventBus = viewer.get('eventBus');
    const tooltip = document.getElementById('taskTooltip');
    const elementRegistry = viewer.get('elementRegistry');

    function isTask(element) {
      const bo = element.businessObject;
      if (!bo) return false;

      return [
        'bpmn:Task',
        'bpmn:UserTask',
        'bpmn:ServiceTask',
        'bpmn:ManualTask',
        'bpmn:ScriptTask',
        'bpmn:BusinessRuleTask',
        'bpmn:SendTask',
        'bpmn:ReceiveTask',
        'bpmn:CallActivity',
        'bpmn:SubProcess'
      ].includes(bo.$type);
    }

    function getDocumentation(bo) {
      if (!bo.documentation || !bo.documentation.length) {
        return '';
      }

      return bo.documentation
        .map(doc => doc.text || '')
        .filter(Boolean)
        .join('\n')
        .replace(/\r\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    function extractUrl(text) {
      const match = text.match(/(?:URL|Link):\s*(https?:\/\/[^\s]+)/i);
      return match ? match[1] : '';
    }

    function removeUrlFromText(text) {
      return text
        .replace(/(?:URL|Link):\s*https?:\/\/[^\s]+/gi, '')
        .replace(/\r\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    function prepareClickableTasks() {
      const elements = elementRegistry.filter(isTask);

      elements.forEach(element => {
        const bo = element.businessObject;
        const rawDocumentation = getDocumentation(bo);
        const url = extractUrl(rawDocumentation);
        const gfx = elementRegistry.getGraphics(element);

        if (gfx && url) {
          gfx.classList.add('clickable-task');
          gfx.style.cursor = 'pointer';
        }
      });
    }

    prepareClickableTasks();

    eventBus.on('element.click', event => {
      const element = event.element;

      if (!isTask(element)) return;

      const bo = element.businessObject;
      const rawDocumentation = getDocumentation(bo);
      const url = extractUrl(rawDocumentation);

      if (url) {
        window.location.href = url;
      }
    });

    eventBus.on('element.hover', event => {
      const element = event.element;

      if (!isTask(element)) return;

      const bo = element.businessObject;
      const title = bo.name || '';
      const rawDocumentation = getDocumentation(bo);
      const url = extractUrl(rawDocumentation);
      const description = removeUrlFromText(rawDocumentation);

      if (!description || !description.trim()) {
        tooltip.innerHTML =
          '<strong>' + escapeHtml(title) + '</strong>' +
          (url ? '<div class="click-hint">Kliknij, aby otworzyć</div>' : '');

        tooltip.style.display = 'block';
        return;
      }

      tooltip.innerHTML =
        '<strong>' + escapeHtml(title) + '</strong>' +
        '<div class="description">' + escapeHtml(description) + '</div>' +
        (url ? '<div class="click-hint">Kliknij, aby otworzyć</div>' : '');

      tooltip.style.display = 'block';
    });

    eventBus.on('element.out', () => {
      tooltip.style.display = 'none';
    });

    document.addEventListener('mousemove', event => {
      if (tooltip.style.display !== 'block') return;

      const offset = 14;

      let left = event.clientX + offset;
      let top = event.clientY + offset;

      const tooltipWidth = tooltip.offsetWidth;
      const tooltipHeight = tooltip.offsetHeight;

      if (left + tooltipWidth > window.innerWidth) {
        left = event.clientX - tooltipWidth - offset;
      }

      if (top + tooltipHeight > window.innerHeight) {
        top = event.clientY - tooltipHeight - offset;
      }

      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
    });
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>

</body>
</html>
